# CI/CD for reservation-system (Next.js 16 / React 19, pnpm) — native Windows
# Server deploy via PM2 (process "NextFrontend"), not NSSM.
#
# next.config.ts has output: "standalone" — the build produces a
# self-contained .next/standalone/server.js with its own pruned,
# non-symlinked node_modules (unlike pnpm's normal virtual-store symlinks,
# which do NOT survive a raw file copy — that's what broke the old
# NSSM-based deploy). Because standalone output has no symlinks, it's safe
# to build in the runner's own checkout and Copy-Item the result into
# DEPLOY_DIR, instead of having to install/build in place there.
#
# Same trust split as booking-system-api: install/typecheck on PRs and
# pushes run on ubuntu-latest (free, isolated, 1x minute rate — never
# windows-latest, that's billed 2x). deploy only runs for pushes to
# develop/master and uses the self-hosted Windows runner registered on the
# deploy server (self-hosted minutes aren't counted against the free quota).
#
# Note: `pnpm lint` is currently broken (missing eslint-plugin-prettier — see
# CLAUDE.md section 1) so it is intentionally not run here. The verification
# gate is `tsc --noEmit`, matching the project's own documented gate.
#
# NOTE: this repo currently only has a `master` branch (no `develop` yet) —
# create one (`git checkout -b develop && git push -u origin develop`) to
# get the same staging-via-develop flow booking-system-api has. Until then,
# the develop triggers below just won't fire.

name: CI/CD

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile

  typecheck:
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  # NEXT_PUBLIC_* vars are inlined into the bundle at build time. Secrets stay
  # on the server: the persisted .env at $DEPLOY_DIR\.env (see
  # WINDOWS_NATIVE_DEPLOYMENT.md step 2) is copied in as .env.production.local
  # right before building, then discarded with the rest of the checkout —
  # nothing server-specific gets written back into git.
  deploy:
    if: github.event_name == 'push'
    needs: [typecheck]
    runs-on: [self-hosted, windows, deploy]
    environment: production
    env:
      DEPLOY_DIR: "C:\\deploy\\booking-system\\frontend"
      # Next.js pings telemetry.nextjs.org on build by default; on this
      # server's network that call can hang instead of timing out cleanly,
      # stalling the whole job. Disable it for CI builds.
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          Copy-Item -Force "$env:DEPLOY_DIR\.env" .\.env.production.local -ErrorAction SilentlyContinue
          pnpm install --frozen-lockfile
          pnpm build
          Copy-Item -Path .next\static -Destination .next\standalone\.next\static -Recurse -Force
          if (Test-Path public) { Copy-Item -Path public -Destination .next\standalone\public -Recurse -Force }
          pm2 stop NextFrontend -ErrorAction SilentlyContinue
          Remove-Item "$env:DEPLOY_DIR\.next\standalone" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$env:DEPLOY_DIR\.next" | Out-Null
          Copy-Item -Path .next\standalone -Destination "$env:DEPLOY_DIR\.next\standalone" -Recurse -Force
          pm2 restart NextFrontend --update-env
          pm2 save
          Start-Sleep -Seconds 3
          $resp = Invoke-WebRequest -Uri http://localhost:3000/ -UseBasicParsing -TimeoutSec 5
          if ($resp.StatusCode -ge 500) { throw "health check failed after deploy: $($resp.StatusCode)" }
